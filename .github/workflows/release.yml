name: ReactorOS update release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rbwr/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: rbwr
      - run: npm run build
        working-directory: rbwr
      - run: sh linux-lab/package-update.sh "$GITHUB_REF_NAME"
      - name: Build Debian Live ISO
        run: |
          mkdir -p release-out/usb
          docker run --rm --privileged -v "$PWD:/project" debian:trixie sh -ec '
            apt-get update
            apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-efi-amd64-bin mtools dosfstools
            sh /project/linux-lab/build-kiosk-iso.sh /project /project/release-out/usb
          '
      - name: Publish ISO release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-out/usb/ReactorOS-amd64.iso \
              release-out/usb/ReactorOS-amd64.iso.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest \
              release-out/usb/ReactorOS-amd64.iso \
              release-out/usb/ReactorOS-amd64.iso.sha256
          fi
      - name: Sign and publish update archive
        env:
          RELEASE_KEY: ${{ secrets.REACTOROS_RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in release-out/reactoros-update.tar.gz -out release-out/reactoros-update.tar.gz.sig
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release-out/reactoros-update.tar.gz release-out/reactoros-update.tar.gz.sig
