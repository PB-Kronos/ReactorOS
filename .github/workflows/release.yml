name: Publish ReactorOS update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rbwr/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: rbwr
      - run: npm run build
        working-directory: rbwr
      - name: Package signed update
        env:
          RELEASE_KEY: ${{ secrets.REACTOROS_RELEASE_KEY }}
        run: |
          version="v1.1.${GITHUB_RUN_NUMBER}"
          sh linux-lab/package-update.sh "$version"
          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in release-out/reactoros-update.tar.gz \
            -out release-out/reactoros-update.tar.gz.sig
          printf '%s\n' "$version" > release-out/VERSION
      - name: Publish rolling update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release-out/VERSION)
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" --clobber \
              release-out/reactoros-update.tar.gz \
              release-out/reactoros-update.tar.gz.sig
          else
            gh release create "$version" --target "$GITHUB_SHA" \
              --title "ReactorOS update $version" \
              --notes "Signed ReactorOS software update for commit $GITHUB_SHA." \
              release-out/reactoros-update.tar.gz \
              release-out/reactoros-update.tar.gz.sig
          fi
