name: Build ReactorOS USB image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rbwr/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: rbwr
      - run: npm run build
        working-directory: rbwr
      - name: Build Debian Live ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 20 --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          if [ -z "$latest" ]; then
            echo 'No published update release exists yet.' >&2
            exit 1
          fi
          echo "REACTOROS_VERSION=$latest" >> "$GITHUB_ENV"
          mkdir -p release-out/usb
          docker run --rm --privileged -e REACTOROS_VERSION="$REACTOROS_VERSION" \
            -v "$PWD:/project" debian:trixie sh -ec '
            apt-get update
            apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-efi-amd64-bin mtools dosfstools
            sh /project/linux-lab/build-kiosk-iso.sh /project /project/release-out/usb "$REACTOROS_VERSION"
          '
      - name: Attach image to latest update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$REACTOROS_VERSION" --clobber \
            release-out/usb/ReactorOS-amd64.iso \
            release-out/usb/ReactorOS-amd64.iso.sha256
