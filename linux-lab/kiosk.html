<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReactorOS Desktop</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: teal; font: 14px Tahoma, sans-serif }
  button { background: silver; border: 2px outset white; padding: 5px 9px; font: inherit }
  button:active { border-style: inset }
  #desktop { position: fixed; inset: 0 0 34px; padding: 18px; isolation: isolate }
  #desktop > button { display: block; margin: 0 0 10px }
  footer { position: fixed; inset: auto 0 0; height: 34px; background: silver;
    border-top: 2px solid white; display: flex; align-items: center; gap: 5px; padding: 2px }
  #identity { margin-left: auto; padding: 3px 8px; border: 2px inset white }
  #menu { position: fixed; z-index: 20; bottom: 34px; left: 2px; background: silver;
    border: 2px outset white; padding: 6px; width: 245px }
  #menu button { width: 100%; text-align: left; margin: 1px 0 }
  .window { position: absolute; left: 16px; top: 16px; width: calc(100% - 70px);
    height: calc(100% - 52px); background: silver; border: 3px outset white;
    resize: both; overflow: hidden; min-width: 300px; min-height: 170px }
  .title { height: 30px; background: navy; color: white; font-weight: bold;
    display: flex; align-items: center; gap: 4px; padding: 2px 5px }
  .title span { flex: 1; cursor: move; user-select: none; touch-action: none }
  .start-icon { display: inline-grid; grid-template-columns: repeat(2, 5px); gap: 1px; margin-right: 4px }
  .start-icon i { height: 5px; background: #df3327 }
  .start-icon i:nth-child(2) { background: #249340 }
  .start-icon i:nth-child(3) { background: #2860bd }
  .start-icon i:nth-child(4) { background: #e9b323 }
  .title button { padding: 0 5px }
  iframe { width: 100%; height: calc(100% - 30px); border: 2px inset white; background: white }
  [hidden] { display: none !important }
</style>
<main id="desktop" aria-label="ReactorOS desktop"></main>
<nav id="menu" aria-label="Start menu" hidden></nav>
<footer><button id="start" aria-expanded="false"><span class="start-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>Start</b></button><span id="tasks"></span><span id="identity">Reading Debian session…</span></footer>
<script type="module">
  if (location.hash) {
    sessionStorage.setItem("reactoros-terminal-token", location.hash.slice(1));
    history.replaceState(null, "", location.pathname + location.search);
  }
  const programs = new Map([
    ["/", "Plant Operations Terminal"], ["/reactor", "RBWR Unit 2"],
    ["/status-desk", "Status Desk"], ["/supervisor", "Plant Supervisor"],
    ["/mainframe", "RBWR Command Console"], ["/manual", "Operator Manual"],
    ["/plant-tools.html?tool=database", "Live Variables"], ["/plant-tools.html?tool=server", "Server Event Log"],
  ]);
  const desktop = document.querySelector("#desktop");
  const menu = document.querySelector("#menu");
  const start = document.querySelector("#start");
  const tasks = document.querySelector("#tasks");
  const identity = document.querySelector("#identity");
  const windows = new Map();
  let topLayer = 0;
  function makeDraggable(handle, pane) {
    handle.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      handle.setPointerCapture(event.pointerId);
      const startX = event.clientX - pane.offsetLeft;
      const startY = event.clientY - pane.offsetTop;
      handle.onpointermove = move => {
        pane.style.left = Math.max(0, Math.min(move.clientX - startX, desktop.clientWidth - 180)) + "px";
        pane.style.top = Math.max(0, Math.min(move.clientY - startY, desktop.clientHeight - 34)) + "px";
      };
    });
    handle.addEventListener("lostpointercapture", () => { handle.onpointermove = null; });
  }
  function button(label, action) {
    const element = document.createElement("button");
    element.textContent = label;
    element.onclick = action;
    return element;
  }
  function showMenu(open) {
    menu.hidden = !open;
    start.setAttribute("aria-expanded", String(open));
  }
  function openProgram(address) {
    const url = new URL(address, location.href);
    const route = url.pathname === "/plant-tools.html" ? url.pathname + url.search : url.pathname;
    if (url.origin !== location.origin || !programs.has(route)) return null;
    showMenu(false);
    const key = url.searchParams.get("window") === "panel" ? url.pathname + url.search : route;
    const existing = windows.get(key);
    if (existing) {
      existing.show();
      if (url.pathname === "/manual" && url.search) existing.frame.src = url.href;
      return existing;
    }
    const label = programs.get(route);
    const pane = document.createElement("section");
    pane.className = "window";
    const frame = document.createElement("iframe");
    frame.title = label;
    frame.src = url.href;
    frame.allow = "autoplay";
    frame.addEventListener("load", () => {
      try { frame.contentWindow.open = openProgram; } catch {}
    });
    const show = () => {
      pane.hidden = false;
      pane.style.zIndex = ++topLayer;
    };
    const task = button(label, show);
    const title = document.createElement("header");
    title.className = "title";
    const caption = document.createElement("span");
    caption.textContent = label;
    makeDraggable(caption, pane);
    title.addEventListener("pointerdown", show);
    pane.style.left = 16 + (windows.size % 5) * 12 + "px";
    pane.style.top = 16 + (windows.size % 5) * 9 + "px";
    title.append(caption, button("Minimize", () => { pane.hidden = true; }),
      button("Close", () => { pane.remove(); task.remove(); windows.delete(key); }));
    pane.append(title, frame);
    desktop.append(pane);
    tasks.append(task);
    const win = { pane, frame, show, focus: show };
    windows.set(key, win);
    show();
    return win;
  }
  start.disabled = true;
  try {
    const response = await fetch("/api/operator", { cache: "no-store" });
    if (!response.ok) throw new Error("Debian session unavailable");
    const { name, permissions } = await response.json();
    if (typeof name !== "string" || !name) throw new Error("Debian account unavailable");
    sessionStorage.setItem("reactoros-debian-operator", name);
    sessionStorage.setItem("reactoros-permissions", JSON.stringify(permissions));
    localStorage.setItem("unit2-operator-name", name);
    identity.textContent = name;
    const permissionByRoute = new Map([
      ["/", "greeting"], ["/reactor", "reactor"], ["/status-desk", "status-desk"],
      ["/supervisor", "supervisor"], ["/mainframe", "mainframe"], ["/manual", "manual"],
      ["/plant-tools.html?tool=database", "live-variables"], ["/plant-tools.html?tool=server", "events"],
    ]);
    for (const [route, title] of programs) {
      if (!permissions.includes("app:" + permissionByRoute.get(route))) {
        programs.delete(route);
        continue;
      }
      menu.append(button(title, () => openProgram(route)));
    }
    for (const [app, title] of Object.entries({
      files: "File Explorer", editor: "Text Editor", images: "Image Viewer", browser: "Internet", users: "User Manager",
    })) {
      if (!permissions.includes(app === "users" ? "users:manage" : "app:" + app)) continue;
      menu.append(button(title, async () => {
        showMenu(false);
        try {
          const reply = await fetch("/api/desktop/launch", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ app }),
          });
          if (!reply.ok) throw new Error((await reply.json()).error);
        } catch (error) {
          alert(`Could not open ${title}: ${error.message}`);
        }
      }));
    }
    for (const route of ["/reactor", "/"]) {
      if (programs.has(route)) desktop.append(button(programs.get(route), () => openProgram(route)));
    }
    start.onclick = () => showMenu(menu.hidden);
    start.disabled = false;
  } catch (error) {
    identity.textContent = error.message;
  }
</script>
</html>
